<app-main [footer]="footer" [contentHeader]="contentHeader" class="profile">
  <ng-template #contentHeader>
    <div *ngIf="showContentHeader" class="p-2-3">
      <app-alert *ngIf="needsToBePaid$ | async" type="warn" class="d-block mb-2">
        Аккаунт неактивен. Пожалуйста, <a class="action-text">продлите подписку</a>, чтобы продолжить пользоваться
        услугами.
      </app-alert>

      <app-alert *ngIf="requiresAdditionalInfo$ | async" type="warn">
        Пожалуйста, заполните необходимые данные профиля.
        <a class="action-text" routerLink="/profile/settings/profile">Перейти к редактированию</a>
      </app-alert>
    </div>
  </ng-template>

  <ng-template #footer>
    <div class="footer mx-auto w-100">
      <div class="toolbar d-flex ai-center bg-light w-100 fixed">
        <div class="buttons d-flex jc-evenly w-100 mx-auto">
          <app-icon-button icon="home" tooltipText="Домой" routerLink="/profile"></app-icon-button>

          <app-menu icon="more_horiz" [items]="menuItems" tooltipText="Меню" tooltipPosition="below"></app-menu>
        </div>
      </div>
    </div>
  </ng-template>
</app-main>
