<app-info-section icon="people" title="Сотрудники" class="d-block pt-2-3">
  <div class="p-2-3">
    <app-empty-placeholder
      class="d-block mb-2"
      text="Пока еще не добавлено ни одного сотрудника"
    ></app-empty-placeholder>

    <div class="d-flex w-max ml-auto">
      <span
        matTooltip="Как только сотрудник подвердит запрос отправленный ему на email, он автоматически появится в списке сотрудников. Для этого он должен быть зарегистрирован в системе с тарифом «Предприниматель»."
        matTooltipPosition="left"
        class="d-flex ai-center w-max mr-2"
      >
        <mat-icon color="primary">help</mat-icon>
      </span>

      <app-flat-button color="primary" text="Добавить сотрудника" (clicked)="addEmployee()"></app-flat-button>
    </div>
  </div>
</app-info-section>
