<h2 mat-dialog-title>Добавить сотрудника</h2>
<mat-dialog-content class="visible relative">
  <app-progress-spinner *ngIf="loading$ | async" class="overlay bg-light-fog"></app-progress-spinner>

  <app-input
    class="d-block"
    extendClass="w-100 mb-0"
    appearance="outline"
    label="Email сотрудника"
    [control]="email"
    [errorMessage]="errorMessage"
  ></app-input>
</mat-dialog-content>
<mat-dialog-actions>
  <app-button mat-dialog-close text="Отмена"></app-button>
  <app-button color="primary" text="Добавить" (clicked)="addEmployee()"></app-button>
</mat-dialog-actions>
