<app-info-section imageName="pricing-plans" icon="local_offer" title="Тарифы" description=""></app-info-section>

<div class="p-1-2 d-flex f-wrap">
  <app-plan-card
    class="p-1 f-1"
    imageName="customer"
    title="КЛИЕНТ"
    [services]="['Личный профиль', 'Букинг услуг']"
    price="БЕСПЛАТНО"
  >
  </app-plan-card>
  <app-plan-card
    class="p-1 f-1"
    imageName="individual"
    title="ПРЕДПРИНИМАТЕЛЬ"
    [services]="['Личный профиль', 'Букинг услуг', 'Предоставление услуг']"
    price="250 грн/мес"
  >
  </app-plan-card>
  <app-plan-card
    class="p-1 f-1"
    imageName="business"
    title="БИЗНЕС"
    [services]="['Бизнес-профиль', 'Предоставление услуг', 'Менеджмент персонала']"
    price="500 грн/мес"
  >
  </app-plan-card>
</div>

<h2 class="p-2-3">Подробнее о тарифах</h2>

<app-info-section
  icon="person"
  title="«Клиент»"
  description="Данный тариф будет интересен пользователям, которые просто хотят воспользоваться чужими услугами. Например, если вы захотели посетить косметолога и уже определились с датой, чтобы зарезерировать услугу, тогда этот тариф Вам прекрасно подойдет!"
>
</app-info-section>

<app-info-section
  svgIcon="account-tie"
  title="«Предприниматель»"
  description="Как следует из названия, данный тариф будет по душе пользователям, которые хотят предоставлять услуги от собственного лица. Например, если вы - фитнес-инструктор и хотите, чтобы ваши клиенты имели возможность записываться к вам на занятия. Помимо этого, вы также имеете возможность пользоваться услугами остальных, как если вы были бы клиентом."
>
</app-info-section>

<app-info-section
  icon="store"
  title="«Бизнес»"
  description="Данное решение призвано удовлетворить нужды бизнеса, путем предоставления возможности централизированного учета (все действия клиентов проходят непосредственно через бизнес-аккаунт), а также возможности управления персоналом. Это подразумевает создание и редактирование профилей сотрудников с указанием списка услуг индивидуально для каждого сотрудника. В данном случае услуги предоставляются от лица вашей фирмы / компании / организации (и пр.). Данный тариф идеально подойдет для лица владеющего одним из перечисленного или группы лиц, объединенных общей деятельностью."
>
</app-info-section>
