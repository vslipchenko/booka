<app-auth-page>
  <app-info-section icon="person_add" title="Регистрация" class="d-block pt-2-3"></app-info-section>

  <div class="p-2-3 d-flex f-column">
    <span (keyup.enter)="signUp()">
      <app-input type="email" appearance="outline" label="Email" extendClass="w-100"></app-input>
      <app-input #input type="password" appearance="outline" label="Пароль" extendClass="w-100" [suffix]="suffix">
        <ng-template #suffix>
          <app-input-hide-suffix [input]="input"></app-input-hide-suffix>
        </ng-template>
      </app-input>
    </span>

    <app-flat-button (clicked)="signUp()" text="Зарегистрироваться" color="primary" extendClass="w-100"></app-flat-button>
  </div>

  <div class="pt-2 bg-primary-light">
    <div class="px-2-3 py-2 bg-light d-flex jc-between">
      Есть аккаунт ? <a routerLink="/sign-in" class="action-text">Войти</a>
    </div>
  </div>
</app-auth-page>
