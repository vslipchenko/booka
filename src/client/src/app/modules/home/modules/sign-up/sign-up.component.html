<app-auth-page>
  <app-info-section icon="person_add" title="Регистрация" class="d-block pt-2-3"></app-info-section>

  <div class="p-2-3 d-flex f-column relative">
    <app-progress-spinner *ngIf="loading$ | async" class="overlay"></app-progress-spinner>

    <app-select
      [control]="account"
      [errorMessage]="errorMessage.bind(this)"
      label="Аккаунт"
      [items]="accountTypes"
      appearance="outline"
      extendClass="w-100 mb-2"
      [hint]="hint"
    >
      <ng-template #hint>
        <div class="pb-1"><a class="action-text" routerLink="/pricing">Подробнее</a></div>
      </ng-template>
    </app-select>

    <span (keyup.enter)="signUp()">
      <app-input
        [control]="email"
        [errorMessage]="emailErrorMessage.bind(this)"
        type="email"
        appearance="outline"
        label="Email"
        hint="На этот email вам придет письмо с подтверждением"
        extendClass="mb-2 w-100"
      ></app-input>
      <app-input
        #input
        [control]="password"
        [errorMessage]="errorMessage.bind(this)"
        type="password"
        appearance="outline"
        label="Пароль"
        extendClass="w-100 mb-4"
        hint="Пароль должен содержать не менее восьми знаков, включать цифры, латинские буквы и символы"
        [suffix]="suffix"
      >
        <ng-template #suffix>
          <app-input-hide-suffix [input]="input"></app-input-hide-suffix>
        </ng-template>
      </app-input>
    </span>

    <app-flat-button
      (clicked)="signUp()"
      text="Зарегистрироваться"
      color="primary"
      extendClass="w-100"
    ></app-flat-button>
  </div>

  <div class="pt-2 bg-primary-light">
    <div class="px-2-3 py-2 bg-light d-flex jc-between">
      Есть аккаунт ? <a routerLink="/sign-in" class="action-text">Войти</a>
    </div>
  </div>
</app-auth-page>
