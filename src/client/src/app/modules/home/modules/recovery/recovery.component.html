<app-narrow-container>
  <app-info-section icon="lock_reset" imageName="auth" title="Восстановление пароля"></app-info-section>

  <div class="p-2-3 relative">
    <app-progress-spinner *ngIf="loading$ | async" class="overlay bg-light-fog"></app-progress-spinner>

    <ng-container *ngIf="submitted; else recovery">
      <ng-container *ngIf="success; else error">
        <app-alert type="success"> Письмо с подтверждением для сброса пароля отправлено вам на почту. </app-alert>
      </ng-container>

      <ng-template #error>
        <app-alert type="error">
          Что-то пошло не так. Проверьте правильность email либо повторите попытку позже.
          <span class="action-text" tabindex="0" (click)="submitted = false">Вернуться</span>
        </app-alert>
      </ng-template>
    </ng-container>

    <ng-template #recovery>
      <app-input
        type="email"
        [control]="email"
        appearance="outline"
        label="Email"
        [hint]="hint"
        [errorMessage]="errorMessage"
        extendClass="mb-2 w-100"
      >
        <ng-template #hint>На этот email вам придет письмо с подтверждением</ng-template>
      </app-input>

      <app-flat-button
        (clicked)="recoverPassword()"
        text="Продолжить"
        color="primary"
        extendClass="w-100"
      ></app-flat-button>
    </ng-template>
  </div>
</app-narrow-container>
