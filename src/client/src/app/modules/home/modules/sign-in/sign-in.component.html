<app-narrow-container>
  <app-info-section icon="login" title="Вход" class="d-block pt-2-3"></app-info-section>

  <div class="p-2-3 d-flex f-column relative">
    <app-progress-spinner *ngIf="loading$ | async" class="overlay bg-light-fog"></app-progress-spinner>

    <span (keyup.enter)="signIn()">
      <app-input
        type="email"
        appearance="outline"
        label="Email"
        extendClass="w-100"
        [control]="email"
        [errorMessage]="errorMessage"
      ></app-input>
      <app-input
        #input
        type="password"
        appearance="outline"
        label="Пароль"
        extendClass="w-100"
        [suffix]="suffix"
        [control]="password"
        [errorMessage]="errorMessage"
      >
        <ng-template #suffix>
          <app-input-hide-suffix [input]="input"></app-input-hide-suffix>
        </ng-template>
      </app-input>
    </span>

    <div class="d-flex jc-between f-wrap mb-2">
      <app-checkbox class="mb-2 mr-1" [control]="rememberMe" label="Запомнить меня"></app-checkbox>
      <a routerLink="/recovery" class="action-text mb-2">Забыли пароль ?</a>
    </div>

    <app-flat-button (clicked)="signIn()" text="Войти" color="primary" extendClass="w-100"></app-flat-button>
  </div>

  <div class="pt-2 bg-primary-light">
    <div class="px-2-3 py-2 bg-light d-flex jc-between">
      Нет аккаунта ? <a routerLink="/sign-up" class="action-text">Зарегистрироваться</a>
    </div>
  </div>
</app-narrow-container>
