<mat-radio-group
  [color]="color"
  [ngClass]="{'d-flex f-column y-position': position === 'vertical'}"
  [formControl]="control"
>
  <mat-radio-button class="radio-button" *ngFor="let item of items" [value]="item.value" [disabled]="item.disabled">
    {{item.title}}
  </mat-radio-button>
</mat-radio-group>
