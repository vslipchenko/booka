<main class="main d-flex f-column">
  <ng-container *ngIf="header" [ngTemplateOutlet]="header"></ng-container>

  <div class="f-1 bg-primary-light">
<!--    <app-progress-spinner *ngIf="loading" class="spinner d-flex jc-center ai-center w-100 fixed bg-light-fog"></app-progress-spinner>-->

    <div class="content bg-light mx-auto">
      <ng-container *ngIf="contentHeader" [ngTemplateOutlet]="contentHeader"></ng-container>

      <ng-container *ngIf="content; else outlet" [ngTemplateOutlet]="content"></ng-container>

      <ng-template #outlet>
        <router-outlet></router-outlet>
      </ng-template>
    </div>
  </div>

  <ng-container *ngIf="footer" [ngTemplateOutlet]="footer"></ng-container>
</main>
