<h2 mat-dialog-title>Выбор языка</h2>
<mat-dialog-content>
  <app-radio-group [control]="languageControl" [items]="languages" color="primary"></app-radio-group>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Отмена</button>
  <button mat-button color="primary" mat-dialog-close>ОК</button>
</mat-dialog-actions>
