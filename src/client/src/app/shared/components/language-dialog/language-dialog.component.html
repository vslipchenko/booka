<h2 mat-dialog-title>Выбор языка</h2>
<mat-dialog-content>
  <app-radio-group [control]="languageControl" [items]="languages"></app-radio-group>
</mat-dialog-content>
<mat-dialog-actions>
  <app-button mat-dialog-close text="Отмена"></app-button>
  <app-button mat-dialog-close color="primary" text="OK"></app-button>
</mat-dialog-actions>
