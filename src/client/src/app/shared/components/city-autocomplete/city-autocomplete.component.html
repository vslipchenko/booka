<mat-form-field [appearance]="appearance" [color]="color" [class]="extendClass">
  <mat-label>{{label}}</mat-label>
  <input type="text"
         matInput
         #trigger="matAutocompleteTrigger"
         (click)="trigger.openPanel()"
         (input)="filter($event)"
         (blur)="recoverValue()"
         (focus)="cityGroups$.next(cityGroups)"
         [formControl]="inputControl"
         [matAutocomplete]="autoGroup">
  <mat-autocomplete #autoGroup="matAutocomplete">
    <mat-optgroup *ngFor="let group of cityGroups$ | async" [label]="group.name">
      <mat-option *ngFor="let item of group.value" [value]="item.value">
        {{item.title}}
      </mat-option>
    </mat-optgroup>
  </mat-autocomplete>
</mat-form-field>
