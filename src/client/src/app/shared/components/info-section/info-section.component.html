<div *ngIf="imageName" class="p-2-3">
  <img class="w-100" src="./assets/images/{{imageName}}.svg" alt="" />
</div>

<div class="d-flex ai-center" [class]="'title-' + horizontalPosition">
  <span class="title-label p-2 bg-primary-light d-flex ai-center"
    ><mat-icon class="c-accent" [svgIcon]="svgIcon">{{ icon }}</mat-icon></span
  >️
  <h2 [class]="titleClass">{{ title }}</h2>
</div>

<p *ngIf="description; else customDescription" class="p-2-3">
  {{ description }}
</p>

<ng-template #customDescription>
  <ng-content></ng-content>
</ng-template>
