<mat-form-field [appearance]="appearance" [color]="color" [class]="extendClass">
  <mat-label>{{label}}</mat-label>
  <input matInput [formControl]="control" [placeholder]="placeholder">
  <mat-hint>{{hint}}</mat-hint>
  <mat-error *ngIf="control.invalid">Control error goes here...</mat-error>
</mat-form-field>
